name: Check email replies
# Backup for the inbox check. The main one is a cron-job.org job (see
# HANDOFF.md) that POSTs to /api/inbox every 5 minutes, because GitHub often
# runs this schedule hours late. The site reads the inbox at most every 4
# minutes, so extra pings are harmless; replies are also picked up whenever
# someone opens the site.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: curl -fsS -X POST https://tower-press-org.vercel.app/api/inbox
