<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Tower Press</title>
<style>
:root{color-scheme:light;--paper:#f3f1e9;--ink:#211e24;--purple:#4d32ad;--line:#c9c4b9;--lime:#def38e}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 system-ui,sans-serif}
header{border-bottom:1px solid var(--line)}header div,main{max-width:850px;margin:auto;padding:0 24px}header div{display:flex;align-items:center;justify-content:space-between;height:65px}header a{font-weight:800;color:inherit;text-decoration:none;letter-spacing:-.04em;font-size:1.3rem}header a:before{content:"";display:inline-block;width:14px;height:14px;background:var(--purple);margin-right:9px;transform:rotate(-12deg)}header span,.mono{font:700 .73rem ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase}
main{padding-bottom:64px}h1,h2{font-family:Georgia,serif;line-height:1.02;font-weight:normal;margin:0 0 18px}h1{font-size:clamp(3rem,10vw,7.2rem);letter-spacing:-.075em;overflow-wrap:anywhere}h2{font-size:2.2rem;letter-spacing:-.04em}p{margin:0 0 16px}.hero{padding:55px 0 32px;border-bottom:2px solid var(--ink);margin-bottom:24px}.hero p:last-child{margin:0}.phase{display:inline-block;padding:5px 9px;background:var(--lime);margin-bottom:12px}.panel{border:1px solid var(--line);background:#faf9f3;padding:22px;margin:16px 0}.admin{border:1px solid var(--purple)}.muted{color:#5a535f}label{display:block;font-weight:650;margin:0 0 12px}input:not([type=checkbox]):not([type=radio]),textarea,select{display:block;width:100%;border:1px solid #8b8491;background:white;color:var(--ink);padding:9px 11px;font:inherit;margin-top:4px;border-radius:0}textarea{min-height:88px;resize:vertical}button{font:700 .9rem system-ui;border:1px solid var(--purple);background:var(--purple);color:white;padding:10px 14px;min-height:43px;cursor:pointer}button.alt{color:var(--purple);background:transparent}button:disabled{opacity:.55;cursor:wait}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #7657d6;outline-offset:3px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.topic{padding:13px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}.topic:last-of-type{margin-bottom:12px}.topic p{white-space:pre-wrap;margin:5px 0}.tag{color:var(--purple);margin-right:9px}.draft{border-top:1px solid var(--line);padding:16px 0 4px}.draft label input[type=number]{width:100px}.note{white-space:pre-wrap;overflow-wrap:anywhere}.status{color:#7b2055;min-height:1.5em;margin-top:14px}.status:empty{min-height:0}.steps{margin:0;color:var(--purple)}.votes{display:flex;gap:6px;align-items:center;margin-top:8px}.votes button{min-height:36px;padding:5px 11px;font-size:.85rem}.votes button[aria-pressed=true]{background:var(--purple);color:white}.votes button[aria-pressed=false]{background:transparent;color:var(--purple)}.when a{color:var(--purple)}.subs{list-style:none;padding:0;margin:0 0 12px}.subs li{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}.subs button{min-height:32px;padding:4px 10px}.row{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.trap{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}.hidden-topic{opacity:.6}button.small{min-height:32px;padding:4px 10px;font-size:.8rem}.card{display:block;padding:14px 0;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}.card:last-child{border-bottom:0}.card:hover strong{color:var(--purple)}.card strong,.card>span{display:block}.card .mono span{margin-right:10px}.chip{display:inline-block;padding:2px 7px;border:1px solid var(--purple);color:var(--purple)}.chip.rsvp-yes{background:var(--lime);border-color:#9bb43a;color:var(--ink)}.chip.rsvp-no{border-color:#7b2055;color:#7b2055}.chip.todo{background:var(--purple);color:white}label.check,label.pick{display:flex;gap:8px;align-items:center;font-weight:500}.choices{border:0;padding:0;margin:0 0 12px;display:flex;gap:18px;flex-wrap:wrap}a.button{display:inline-block;font:700 .9rem system-ui;border:1px solid var(--purple);padding:10px 14px;text-decoration:none}a.button.alt{color:var(--purple)}details.panel summary{cursor:pointer;font-weight:650}h3{font-size:1rem;margin:16px 0 6px}#who a{color:var(--purple)}@media(max-width:560px){.row{grid-template-columns:1fr}}@media(max-width:460px){header span{display:none}.panel{padding:16px}.hero{padding-top:38px}}
</style>
<header><div><a href="/">Tower Press</a><span id="who"></span></div></header>
<main><div id="app">Loading…</div><p id="status" class="status" role="status"></p></main>
<script src="/app.js"></script>
</html>
