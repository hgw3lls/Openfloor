<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Tower Press</title>
<link rel="stylesheet" href="/fonts/fonts.css"><link rel="stylesheet" href="/wall.css">
<link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon-192.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#211e24"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Tower Press"><meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>
:root{color-scheme:light;--paper:#f3f1e9;--ink:#211e24;--purple:#4d32ad;--line:#c9c4b9;--lime:#def38e}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 Geist,system-ui,sans-serif}
header{border-bottom:1px solid var(--line)}header div,main{max-width:850px;margin:auto;padding:0 24px}header div{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;min-height:65px;padding-top:8px;padding-bottom:8px}header a.brand{font-weight:800;color:inherit;text-decoration:none;letter-spacing:-.04em;font-size:1.3rem}header a.brand:before{content:"";display:inline-block;width:14px;height:14px;background:var(--purple);margin-right:9px;transform:rotate(-12deg)}.mono{font:700 .73rem 'JetBrains Mono',ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase}
main{padding-bottom:64px}h1,h2{font-family:'Instrument Serif',Georgia,serif;line-height:1.02;font-weight:normal;margin:0 0 18px}h1{font-size:clamp(3rem,10vw,7.2rem);letter-spacing:-.035em;overflow-wrap:anywhere}h2{font-size:2.2rem;letter-spacing:-.02em}p{margin:0 0 16px}.hero{padding:55px 0 32px;border-bottom:2px solid var(--ink);margin-bottom:24px}.hero p:last-child{margin:0}.phase{display:inline-block;padding:5px 9px;background:var(--lime);margin-bottom:12px}.panel{border:1px solid var(--line);background:#faf9f3;padding:22px;margin:16px 0}.admin{border:1px solid var(--purple)}.muted{color:#5a535f}label{display:block;font-weight:650;margin:0 0 12px}input:not([type=checkbox]):not([type=radio]),textarea,select{display:block;width:100%;border:1px solid #8b8491;background:white;color:var(--ink);padding:9px 11px;font:inherit;margin-top:4px;border-radius:0}textarea{min-height:88px;resize:vertical}button{font:700 .9rem Geist,system-ui;border:1px solid var(--purple);background:var(--purple);color:white;padding:10px 14px;min-height:43px;cursor:pointer}button.alt{color:var(--purple);background:transparent}button:disabled{opacity:.55;cursor:wait}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #7657d6;outline-offset:3px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.topic{padding:13px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}.topic:last-of-type{margin-bottom:12px}.topic p{white-space:pre-wrap;margin:5px 0}.tag{color:var(--purple);margin-right:9px}.draft{border-top:1px solid var(--line);padding:16px 0 4px}.draft label input[type=number]{width:100px}.note{white-space:pre-wrap;overflow-wrap:anywhere}.status{color:#7b2055;min-height:1.5em;margin-top:14px}.status:empty{min-height:0}.steps{margin:0;color:var(--purple)}.votes{display:flex;gap:6px;align-items:center;margin-top:8px}.votes button{min-height:36px;padding:5px 11px;font-size:.85rem}.votes button[aria-pressed=true]{background:var(--purple);color:white}.votes button[aria-pressed=false]{background:transparent;color:var(--purple)}.when a{color:var(--purple)}.subs{list-style:none;padding:0;margin:0 0 12px}.subs li{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}.subs button{min-height:32px;padding:4px 10px}.row{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.trap{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}.hidden-topic{opacity:.6}button.small{min-height:32px;padding:4px 10px;font-size:.8rem}.card{display:block;padding:14px 0;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}.card:last-child{border-bottom:0}.card:hover strong{color:var(--purple)}.card strong,.card>span{display:block}.card .mono span{margin-right:10px}.chip{display:inline-block;padding:2px 7px;border:1px solid var(--purple);color:var(--purple)}.chip.rsvp-yes{background:var(--lime);border-color:#9bb43a;color:var(--ink)}.chip.rsvp-no{border-color:#7b2055;color:#7b2055}.chip.todo{background:var(--purple);color:white}label.check,label.pick{display:flex;gap:8px;align-items:center;font-weight:500}.choices{border:0;padding:0;margin:0 0 12px;display:flex;gap:18px;flex-wrap:wrap}a.button{display:inline-block;font:700 .9rem Geist,system-ui;border:1px solid var(--purple);padding:10px 14px;text-decoration:none;background:var(--purple);color:white}a.button.alt{background:transparent;color:var(--purple)}a.button.small{padding:5px 10px;font-size:.8rem}details.panel summary{cursor:pointer;font-weight:650}h3{font-size:1rem;margin:16px 0 6px}#nav{display:flex;gap:4px 14px;flex-wrap:wrap;align-items:center;font-size:.92rem}#nav a{color:var(--ink);text-decoration:none;font-weight:600}#nav a.on{color:var(--purple);text-decoration:underline;text-underline-offset:4px}#nav .who{color:#5a535f;font-size:.85rem}#nav button{min-height:32px;padding:4px 10px;font-size:.8rem}#banner:not(:empty){background:var(--lime);border-bottom:1px solid #9bb43a;text-align:center;padding:8px 16px;font-weight:650}#banner button{margin-left:10px;min-height:30px;padding:3px 10px;font-size:.8rem}.orgbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;border:1px solid var(--purple);background:#efedff;padding:10px 14px;margin:16px 0}.orgbar strong{color:var(--purple)}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:0 0 8px}.stat{border:1px solid var(--line);background:white;padding:12px}.stat b{display:block;font:normal 2rem 'Instrument Serif',Georgia,serif}.stat a{color:inherit}.attention li{padding:8px 0}.slot{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}.slot .who{font-size:.9rem;color:#5a535f}.full{color:#5a535f;font-weight:650}.action.done strong{text-decoration:line-through;opacity:.6}.late{color:#7b2055;font-weight:650}label.panel{display:block}.comments{list-style:none;padding:0;margin:0 0 12px}.comments li{padding:10px 0;border-bottom:1px solid var(--line)}.comments .meta{font-size:.85rem;color:#5a535f}.comments .body{overflow-wrap:anywhere;margin-top:2px}.comments.small li{padding:6px 0;font-size:.92rem}button.link{background:none;border:0;color:#7b2055;padding:0 4px;min-height:0;font:inherit;text-decoration:underline;cursor:pointer}.sr{position:absolute;left:-9999px}.reply textarea{min-height:70px}details.talk summary,details.draft summary{cursor:pointer;color:var(--purple);font-weight:650;margin-top:6px}fieldset.stack{border:0;padding:0;margin:0 0 8px}fieldset.stack legend{font-weight:650;margin-bottom:6px}fieldset.stack label.pick{align-items:flex-start;margin-bottom:10px}fieldset.stack label.pick input{margin-top:5px}#who a{color:var(--purple)}.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:0 14px;border-bottom:1px solid var(--line);margin-bottom:10px}@media(max-width:560px){.row,.levels{grid-template-columns:1fr}}@media(max-width:460px){.panel{padding:16px}.hero{padding-top:38px}}
header a.brand img{display:block;height:44px;width:auto;max-width:220px}header a.brand:has(img){display:flex}header a.brand:has(img):before{content:none;display:none}.logo-slot{margin:18px 0 0}.logo-preview{display:block;max-height:80px;max-width:100%;margin:6px 0 10px;background:repeating-conic-gradient(#ffffff14 0 25%,transparent 0 50%) 0 0/16px 16px}.logo-preview.square{max-height:140px}.inline-form{display:flex;gap:10px;flex-wrap:wrap;align-items:center}</style>
